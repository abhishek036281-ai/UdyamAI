<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - UdyamAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/app.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 50: '#f0f4f8', 100: '#d9e2ec', 800: '#102a43', 900: '#0a1a2e' },
                        primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-mesh text-slate-800 min-h-screen flex flex-col justify-between font-sans text-slate-800">
    <!-- Navbar -->
    <nav class="bg-white shadow-sm border-b border-slate-200/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="/" class="flex items-center space-x-3 group">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white font-black text-lg shadow-sm">
                        ⚡
                    </div>
                    <span class="text-slate-900 text-lg font-extrabold tracking-tight">UdyamAI</span>
                </a>
                <div id="nav-auth"></div>
            </div>
        </div>
    </nav>

    <div class="max-w-md w-full mx-auto p-6 my-auto">
        <div class="glass-card p-8 sm:p-10 rounded-3xl animate-fade-in-up">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Create Your Account</h2>
                <p class="text-slate-500 text-sm mt-2">Join to discover tailored government entrepreneur schemes</p>
            </div>

            <form id="registerForm" onsubmit="handleRegisterForm(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Full Name *</label>
                    <input type="text" id="full_name" required placeholder="e.g. Ramesh Kumar"
                           class="w-full px-4 py-3 rounded-xl border input-premium text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Email Address *</label>
                    <input type="email" id="email" required placeholder="name@domain.com"
                           class="w-full px-4 py-3 rounded-xl border input-premium text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Password *</label>
                    <input type="password" id="password" minlength="6" required placeholder="Minimum 6 characters"
                           class="w-full px-4 py-3 rounded-xl border input-premium text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Confirm Password *</label>
                    <input type="password" id="confirm_password" minlength="6" required placeholder="Re-enter password"
                           class="w-full px-4 py-3 rounded-xl border input-premium text-sm">
                </div>

                <button type="submit" id="submitBtn"
                        class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3.5 rounded-xl transition duration-200 shadow-lg shadow-blue-600/20 text-sm">
                    Create Account
                </button>
            </form>

            <div class="mt-8 text-center text-sm text-slate-500 border-t border-slate-100 pt-6">
                Already have an account? 
                <a href="/login.html" class="text-blue-600 font-bold hover:underline">Log in here</a>
            </div>
        </div>
    </div>

    <footer class="py-6 text-center text-xs text-slate-400">
        UdyamAI — AI-Driven Scheme Matching Platform
    </footer>

    <script>
        async function handleRegisterForm(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            
            const fullName = document.getElementById('full_name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            // Validation checks
            if (!fullName) {
                showToast('Please enter your full name.', 'error');
                return;
            }
            if (!email) {
                showToast('Please enter a valid email address.', 'error');
                return;
            }
            if (password.length < 6) {
                showToast('Password must be at least 6 characters long.', 'error');
                return;
            }
            if (password !== confirmPassword) {
                showToast('Passwords do not match. Please recheck.', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = 'Creating account...';

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        full_name: fullName,
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.detail || 'Registration failed');
                }

                showToast('Account created successfully! Redirecting to login...', 'success');

                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 800);
            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = 'Create Account';
            }
        }
    </script>
</body>
</html>
