services:
  - type: web
    name: udyamai-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: udyamai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AI_API_KEY
        sync: false

databases:
  - name: udyamai-db
    plan: free
