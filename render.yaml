services:
  - type: web
    name: udyamai-backend
    env: docker
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: udyamai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AI_API_KEY
        sync: false

databases:
  - name: udyamai-db
    plan: free
